<div class="table-container mat-elevation-z4">

  <!-- Search Form -->
  <form class="user-search" aria-label="Search users">

    <input
      type="text"
      placeholder="First name"
      aria-label="First name"
      [(ngModel)]="firstName"
      name="firstName"
    />

    <input
      type="text"
      placeholder="Flat number"
      aria-label="Flat number"
      [(ngModel)]="flatNumber"
      name="flatNumber"
    />

    <input
      type="text"
      placeholder="Phone number"
      aria-label="Phone number"
      [(ngModel)]="phoneNumber"
      name="phoneNumber"
      (input)="allowPhoneOnly($event)"
    />

    <button
      class="search-button"
      type="button"
      (click)="searchUsers()">

      <svg
        aria-hidden="true"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round">

        <circle cx="11" cy="11" r="7"></circle>
        <path d="m20 20-3.5-3.5"></path>

      </svg>

      Search
    </button>

    <button
      class="reset-button"
      type="button"
      (click)="resetForm()">
      Reset
    </button>

  </form>

  <!-- Page Header -->
  <div class="page-header">

    <h2>User List</h2>

    <div class="page-actions">

      <button
        class="icon-button"
        type="button"
        (click)="openAddPanel()"
        aria-label="Add user">

        <svg
          aria-hidden="true"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="3"
          stroke-linecap="round">

          <path d="M12 5v14"></path>
          <path d="M5 12h14"></path>

        </svg>

      </button>

    </div>

    <mat-form-field appearance="outline">
      <mat-label>Search</mat-label>
      <input matInput placeholder="Search user..." />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

  </div>

  <!-- Table -->
  <table mat-table [dataSource]="dataSource">

    <!-- Name -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>

      <td mat-cell *matCellDef="let row">

        <div class="user-info">

          <div class="avatar">
            {{ row.name?.charAt(0) }}
          </div>

          <span>{{ row.name }}</span>

        </div>

      </td>
    </ng-container>

    <!-- Email -->
    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let row">
        {{ row.email }}
      </td>
    </ng-container>

    <!-- Phone -->
    <ng-container matColumnDef="phone">
      <th mat-header-cell *matHeaderCellDef>Phone Number</th>
      <td mat-cell *matCellDef="let row">
        {{ row.phone }}
      </td>
    </ng-container>

    <!-- Flat -->
    <ng-container matColumnDef="flat">
      <th mat-header-cell *matHeaderCellDef>Flat Number</th>

      <td mat-cell *matCellDef="let row">

        <span class="flat-badge">
          {{ row.flat }}
        </span>

      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns">
    </tr>

  </table>

  <!-- Paginator -->
  <mat-paginator
    [pageSize]="10"
    [pageSizeOptions]="[5,10,20,50]">
  </mat-paginator>

</div>

<!-- Add User Slide Panel -->
<ng-container *ngIf="showAddPanel">

  <div
    class="slide-backdrop"
    [class.closing]="isAddPanelClosing"
    (click)="closeAddPanel()">
  </div>

  <aside
    class="add-slide-panel"
    [class.closing]="isAddPanelClosing"
    aria-label="Add user panel">

    <div class="slide-panel-header">

      <h3>Add User</h3>

      <button
        class="slide-close-button"
        type="button"
        (click)="closeAddPanel()"
        aria-label="Close add user panel">
        ×
      </button>

    </div>

    <app-useradd
      (created)="closeAddPanel()"
      (cancelled)="closeAddPanel()">
    </app-useradd>

  </aside>

</ng-container>
