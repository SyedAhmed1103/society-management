<section class="user-page">

  <form class="user-search" aria-label="Search users">

    <input
      type="text"
      placeholder="First name"
      aria-label="First name"
      [(ngModel)]="firstName"
      name="firstName"
    />

    <input
      type="text"
      placeholder="Flat number"
      aria-label="Flat number"
      [(ngModel)]="flatNumber"
      name="flatNumber"
    />

    <input
      type="text"
      placeholder="Phone number"
      aria-label="Phone number"
      [(ngModel)]="phoneNumber"
      name="phoneNumber"
      (input)="allowPhoneOnly($event)"
    />

    <button
      class="search-button"
      type="button"
      (click)="searchUsers()">

      <svg
        aria-hidden="true"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round">

        <circle cx="11" cy="11" r="7"></circle>
        <path d="m20 20-3.5-3.5"></path>

      </svg>

      Search
    </button>

    <button
      class="reset-button"
      type="button"
      (click)="resetForm()">
      Reset
    </button>

  </form>

  <div class="page-header">

    <h2>User List</h2>

    <div class="page-actions">
      <button
        class="icon-button"
        type="button"
        (click)="openAddPanel()"
        aria-label="Add user">
        <svg
          aria-hidden="true"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="3"
          stroke-linecap="round">
          <path d="M12 5v14"></path>
          <path d="M5 12h14"></path>
        </svg>
      </button>
    </div>

  </div>

  <div class="table-panel">

    <table>

      <thead>
        <tr>
          <th>First Name</th>
          <th>Email Address</th>
          <th>Phone Number</th>
          <th>Flat Number</th>
        </tr>
      </thead>

      <tbody>

        <tr class="empty-row">
          <td colspan="4">
            Search users to view results.
          </td>
        </tr>

      </tbody>

    </table>

  </div>

  <ng-container *ngIf="showAddPanel">
    <div
      class="slide-backdrop"
      [class.closing]="isAddPanelClosing"
      (click)="closeAddPanel()">
    </div>

    <aside
      class="add-slide-panel"
      [class.closing]="isAddPanelClosing"
      aria-label="Add user panel">
      <div class="slide-panel-header">
        <h3>Add User</h3>

        <button
          class="slide-close-button"
          type="button"
          (click)="closeAddPanel()"
          aria-label="Close add user panel">
          x
        </button>
      </div>

      <app-useradd
        (created)="closeAddPanel()"
        (cancelled)="closeAddPanel()">
      </app-useradd>
    </aside>
  </ng-container>

</section>
