<section class="user-page">
  <form class="user-search" aria-label="Search users">
    <input type="text" placeholder="First name" aria-label="First name" />
    <input type="text" placeholder="Flat number" aria-label="Flat number" />
    <input type="tel" placeholder="Phone number" aria-label="Phone number" />

    <button class="search-button" type="button">
      <svg
        aria-hidden="true"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="11" cy="11" r="7"></circle>
        <path d="m20 20-3.5-3.5"></path>
      </svg>
      Search
    </button>

    <button class="reset-button" type="button">Reset</button>
  </form>

  <div class="page-header">
    <h2>User List</h2>

    <div class="page-actions">
      <button class="icon-button" routerLink="/user/add" aria-label="Add user">+</button>
    </div>
  </div>

  <div class="table-panel">
    <table>
      <thead>
        <tr>
          <th>First Name</th>
          <th>Email Address</th>
          <th>Phone Number</th>
          <th>Flat Number</th>
        </tr>
      </thead>
      <tbody>
        <tr class="empty-row">
          <td colspan="4">Search users to view results.</td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
