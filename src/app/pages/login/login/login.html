<div class="login-container">

  <!-- Left Section -->
  <div class="left-panel">

    <div class="content">

      <mat-icon class="logo">apartment</mat-icon>

      <h1>Society Management Pro</h1>

      <p>
        Manage Residents, Maintenance,
        Visitors and Complaints from
        a single platform.
      </p>

      <div class="features">

        <div>
          <mat-icon>check_circle</mat-icon>
          Resident Management
        </div>

        <div>
          <mat-icon>check_circle</mat-icon>
          Maintenance Tracking
        </div>

        <div>
          <mat-icon>check_circle</mat-icon>
          Visitor Monitoring
        </div>

        <div>
          <mat-icon>check_circle</mat-icon>
          Complaint Resolution
        </div>

      </div>

    </div>

  </div>

  <!-- Right Section -->
  <div class="right-panel">

    <mat-card class="login-card mat-elevation-z12">

      <mat-card-header>
        <mat-card-title>
          Welcome Back
        </mat-card-title>
      </mat-card-header>

      <mat-card-content>

        <mat-form-field appearance="outline">
          <mat-label>Username</mat-label>
          <input
            matInput
            name="username"
            [(ngModel)]="username">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>

          <input
            matInput
            [type]="hidePassword ? 'password' : 'text'"
            name="password"
            [(ngModel)]="password">

          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="hidePassword = !hidePassword">

            <mat-icon>
              {{hidePassword ? 'visibility_off' : 'visibility'}}
            </mat-icon>

          </button>

        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          class="login-btn">

          Sign In

        </button>

      </mat-card-content>

    </mat-card>

  </div>

</div>
