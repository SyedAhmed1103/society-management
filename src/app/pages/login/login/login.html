<div class="login-wrapper">

    <div class="login-left">

        <div class="overlay"></div>

        <div class="content">
            <h1>Society Management System</h1>

            <p>
                Manage buildings, flats, maintenance,
                complaints, notices and payments from
                one powerful dashboard.
            </p>

            <img src="https://www.itdax.in/assets/img/itdax-studio.webp" alt="Illustration">
        </div>

    </div>

    <div class="login-right">

        <div class="login-card">

            <div class="logo">
                <img src="https://www.itdax.in/assets/img/itdax-studio.webp" alt="">
            </div>

            <h2>Welcome Back</h2>

            <p class="subtitle">
                Login to access your dashboard
            </p>

            <form (ngSubmit)="login()">

                <div class="form-group">
                    <label>Email / Phone Number</label>

                    <input
                        type="text"
                        placeholder="Enter Email or Mobile Number"
                        name="emailOrPhone"
                        [(ngModel)]="emailOrPhone"
                        autocomplete="username">
                </div>

                <div class="form-group">
                    <label>Password</label>

                    <div class="password-wrapper">
                        <input
                            [type]="showPassword ? 'text' : 'password'"
                            name="password"
                            [(ngModel)]="password"
                            autocomplete="current-password">

                        <button
                            type="button"
                            (click)="showPassword = !showPassword">
                            {{ showPassword ? 'Hide' : 'Show' }}
                        </button>
                    </div>
                </div>

                <p class="login-error" *ngIf="errorMessage">
                    {{ errorMessage }}
                </p>

                <div class="options">

                    <label class="remember-me">
                        <input type="checkbox">
                        <span>Remember Me</span>
                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>

                <button
                    type="submit"
                    class="login-btn"
                    [disabled]="isLoggingIn">
                    {{ isLoggingIn ? 'Logging in...' : 'Login' }}
                </button>

            </form>
        </div>

    </div>

</div>
