<div class="login-wrapper">

    <div class="login-left">

        <div class="overlay"></div>

        <div class="content">
            <h1>Society Management System</h1>

            <p>
                Manage buildings, flats, maintenance,
                complaints, notices and payments from
                one powerful dashboard.
            </p>

            <img src="https://www.itdax.in/assets/img/itdax-studio.webp" alt="Illustration">
        </div>

    </div>

    <div class="login-right">

        <div class="login-card">

            <div class="logo">
                <img src="https://www.itdax.in/assets/img/itdax-studio.webp" alt="">
            </div>

            <h2>Welcome Back 👋</h2>

            <p class="subtitle">
                Login to access your dashboard
            </p>

            <form (ngSubmit)="login()">

                <!-- Building -->

                <div class="form-group">
                    <label>Building Name</label>

                    <select>
                        <option value="">Select Building</option>
                        <option value="1">Royal Residency</option>
                        <option value="2">Green Tower</option>
                        <option value="3">Sky Heights</option>
                    </select>
                </div>

                <!-- Email / Mobile -->

                <div class="form-group">
                    <label>Email / Mobile Number</label>

                    <input type="text" placeholder="Enter Email or Mobile Number">
                </div>

                <!-- Password -->

                <div class="form-group">
                    <label>Password</label>

                    <div class="password-wrapper">
                        <input type="password">

                        <button type="button">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Options -->

                <div class="options">

                    <label class="remember-me">
                        <input type="checkbox">
                        <span>Remember Me</span>
                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>

                <!-- Login -->

               <button
    type="submit"
    class="login-btn">
    Login
  </button>

            </form>
        </div>

    </div>

</div>
